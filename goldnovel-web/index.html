              <input id="chTitle" required placeholder="ชื่อตอน" class="sm:col-span-3 px-3.5 py-2.5 rounded-xl text-sm" style="background-color: var(--bg-input); border: 1px solid var(--border-soft);">
            </div>
            <textarea id="chContent" required rows="7" placeholder="วางเนื้อหานิยายที่นี่... (ขึ้นย่อหน้าใหม่ด้วยการกด Enter)" class="w-full px-3.5 py-2.5 rounded-xl text-sm focus:outline-none" style="background-color: var(--bg-input); border: 1px solid var(--border-soft);"></textarea>
            <button type="submit" class="px-6 py-2.5 rounded-xl text-sm btn-gold">เผยแพร่ตอนนิยาย</button>
          </form>
        `;
      } else if (state.adminTab === 'banners') {
        const s = state.settings;
        body = `
          <form id="bannerForm" class="card-panel rounded-2xl p-5 space-y-4">
            <h3 class="font-bold text-base" style="color: var(--gold-1);">ปรับแต่งแบนเนอร์หน้าแรก &amp; ป้ายโปรโมชัน</h3>
            <div class="space-y-2.5">
              <label class="block text-xs font-semibold">หัวข้อแบนเนอร์หลัก (Hero Banner)</label>
              <input id="bHeroTitle" value="${s.hero_title}" class="w-full px-3.5 py-2.5 rounded-xl text-sm" style="background-color: var(--bg-input); border: 1px solid var(--border-soft);">
              <input id="bHeroTagline" value="${s.hero_tagline}" class="w-full px-3.5 py-2.5 rounded-xl text-sm" style="background-color: var(--bg-input); border: 1px solid var(--border-soft);">
              <label class="block text-xs" style="color: var(--text-sub);">อัปโหลดรูปภาพแบนเนอร์หลัก (แนวนอน 16:9)</label>
              <input id="bHeroFile" type="file" accept="image/*" class="w-full text-xs p-2 rounded-xl" style="background-color: var(--bg-input); border: 1px dashed var(--border-subtle);">
            </div>
            <div class="space-y-2.5 pt-4 border-t" style="border-color: var(--border-soft);">
              <label class="block text-xs font-semibold">ข้อความป้ายโปรโมชันเติมเงิน</label>
              <input id="bPromoTitle" value="${s.promo_title}" class="w-full px-3.5 py-2.5 rounded-xl text-sm" style="background-color: var(--bg-input); border: 1px solid var(--border-soft);">
              <input id="bPromoSub" value="${s.promo_subtitle}" class="w-full px-3.5 py-2.5 rounded-xl text-sm" style="background-color: var(--bg-input); border: 1px solid var(--border-soft);">
              <label class="block text-xs" style="color: var(--text-sub);">อัปโหลดรูปภาพป้ายโปรโมชัน (แนวนอน)</label>
              <input id="bPromoFile" type="file" accept="image/*" class="w-full text-xs p-2 rounded-xl" style="background-color: var(--bg-input); border: 1px dashed var(--border-subtle);">
            </div>
            <button type="submit" class="px-6 py-2.5 rounded-xl text-sm btn-gold">บันทึกการเปลี่ยนแปลงหน้าแรก</button>
          </form>
        `;
      } else {
        const pending = state.transactions.filter(t => t.type === 'topup');
        body = `
          <div class="card-panel rounded-2xl overflow-hidden">
            <div class="px-5 py-4 border-b font-bold text-sm" style="border-color: var(--border-soft);">รายการแจ้งเติมเงิน (${pending.length})</div>
            <div>
              ${pending.length === 0 ? `<div class="p-8 text-center text-xs" style="color: var(--text-muted);">ยังไม่มีรายการแจ้งเติมเงิน</div>` :
                pending.map(tx => `
                  <div class="px-5 py-4 border-b last:border-b-0 flex flex-wrap items-center justify-between gap-3" style="border-color: var(--border-soft);">
                    <div>
                      <div class="text-sm font-semibold">${tx.note || 'แจ้งเติมเงิน'} (${tx.amount_baht} บาท → +${tx.coins_delta} เหรียญ)</div>
                      <div class="text-xs" style="color: var(--text-muted);">ช่องทาง: ${tx.payment_method} · สถานะ: ${tx.status}</div>
                    </div>
                    ${tx.status === 'pending'
                      ? `<button type="button" data-approve-tx="${tx.id}" class="px-4 py-1.5 rounded-lg text-xs btn-gold">อนุมัติ &amp; เติมเหรียญ</button>`
                      : `<span class="text-xs px-2.5 py-1 rounded-full" style="background-color: rgba(34,197,94,0.16); color: #4ADE80;">อนุมัติแล้ว</span>`}
                  </div>
                `).join('')}
            </div>
          </div>
        `;
      }

      return `
        <div class="fade-in max-w-4xl mx-auto space-y-5">
          <div class="flex flex-wrap items-center justify-between gap-2">
            <div>
              <h1 class="text-xl font-bold">หลังบ้านนักเขียน (GoldNovel Admin)</h1>
              <p class="text-xs" style="color: var(--text-sub);">อัปโหลดรูปปก แบนเนอร์ ลงตอนนิยาย และจัดการการเติมเงินได้เองโดยไม่ต้องแก้โค้ด</p>
            </div>
          </div>
          <div class="flex flex-wrap gap-2">
            ${tabs.map(t => `
              <button type="button" data-admin-tab="${t.id}" class="px-4 py-2 rounded-xl text-xs font-semibold transition-all" style="${state.adminTab === t.id ? 'background: linear-gradient(135deg, #F3D999, #D4A857); color: #161410;' : 'background-color: var(--bg-card); border: 1px solid var(--border-subtle); color: var(--text-sub);'}">${t.label}</button>
            `).join('')}
          </div>
          ${body}
        </div>
      `;
    }

    function render() {
      applyChrome();
      const el = document.getElementById('mainContent');
      if (state.view === 'home') el.innerHTML = renderHome();
      else if (state.view === 'novel') el.innerHTML = renderNovelDetail();
      else if (state.view === 'reader') el.innerHTML = renderReader();
      else if (state.view === 'library') el.innerHTML = renderLibrary();
      else if (state.view === 'settings') el.innerHTML = renderSettings();
      else if (state.view === 'admin') el.innerHTML = renderAdmin();
      bindDynamic();
    }

    function openTopup(msg) {
      if (!state.user) {
        openAuthModal();
        showToast('กรุณาเข้าสู่ระบบก่อนเติมเหรียญ');
        return;
      }
      document.getElementById('topupBonusBadge').textContent = CFG.topupBonusPercent > 0 ? `โปรโมชั่นโบนัส +${CFG.topupBonusPercent}%` : 'เติมเหรียญ GoldNovel';
      document.getElementById('topupSubtext').textContent = msg || 'รองรับ PromptPay และ TrueMoney Wallet';
      document.getElementById('topupStep1').classList.remove('hidden');
      document.getElementById('topupStep2').classList.add('hidden');
      renderPackages();
      renderPayOpts();
      const m = document.getElementById('topupModal');
      m.classList.remove('hidden');
      m.classList.add('flex');
    }

    function closeTopup() {
      const m = document.getElementById('topupModal');
      m.classList.add('hidden');
      m.classList.remove('flex');
    }

    function calcCoins(baht) {
      return Math.round(baht * (1 + Number(CFG.topupBonusPercent || 0) / 100));
    }

    function renderPackages() {
      const grid = document.getElementById('pkgGrid');
      grid.innerHTML = PACKAGES.map(baht => {
        const active = baht === state.selectedBaht;
        const coins = calcCoins(baht);
        return `
          <button type="button" data-pkg="${baht}" class="p-3 rounded-xl border text-center" style="border-color: ${active ? 'var(--gold-1)' : 'var(--border-soft)'}; background-color: ${active ? 'var(--gold-soft)' : 'var(--bg-input)'};">
            <div class="text-base font-bold">${baht} ฿</div>
            <div class="text-[11px]" style="color: var(--gold-1);">${coins} เหรียญ</div>
          </button>
        `;
      }).join('');
      grid.querySelectorAll('[data-pkg]').forEach(btn => {
        btn.addEventListener('click', () => {
          state.selectedBaht = Number(btn.getAttribute('data-pkg'));
          renderPackages();
        });
      });
    }

    function renderPayOpts() {
      document.querySelectorAll('.pay-opt').forEach(btn => {
        const active = btn.getAttribute('data-pay') === state.selectedPay;
        btn.style.borderColor = active ? 'var(--gold-1)' : 'var(--border-soft)';
        btn.style.backgroundColor = active ? 'var(--gold-soft)' : 'var(--bg-input)';
      });
    }

    let authMode = 'login';
    function setAuthMode(mode) {
      authMode = mode;
      const isSignup = mode === 'signup';
      document.getElementById('authModalTitle').textContent = isSignup ? 'สมัครสมาชิก GoldNovel' : 'เข้าสู่ระบบ GoldNovel';
      document.getElementById('signupNameWrap').classList.toggle('hidden', !isSignup);
      document.getElementById('signupConfirmWrap').classList.toggle('hidden', !isSignup);
      document.getElementById('authSubmitBtn').textContent = isSignup ? 'สร้างบัญชีสมาชิก' : 'เข้าสู่ระบบ';
      const tLogin = document.getElementById('tabLoginBtn');
      const tSignup = document.getElementById('tabSignupBtn');
      tLogin.style.background = !isSignup ? 'linear-gradient(135deg, #F3D999, #D4A857)' : 'transparent';
      tLogin.style.color = !isSignup ? '#161410' : 'var(--text-sub)';
      tSignup.style.background = isSignup ? 'linear-gradient(135deg, #F3D999, #D4A857)' : 'transparent';
      tSignup.style.color = isSignup ? '#161410' : 'var(--text-sub)';
    }

    function openAuthModal(defaultMode = 'login') {
      const m = document.getElementById('authModal');
      const hasUser = !!state.user;
      document.getElementById('authFormsWrap').classList.toggle('hidden', hasUser);
      document.getElementById('authUserInfo').classList.toggle('hidden', !hasUser);
      if (hasUser) {
        document.getElementById('authModalTitle').textContent = 'บัญชีของฉัน';
        document.getElementById('authEmailDisplay').textContent = state.user.email;
        document.getElementById('authRoleDisplay').textContent = state.user.role === 'admin' ? 'สิทธิ์: เจ้าของเว็บ (Admin)' : 'สิทธิ์: ผู้อ่าน (Reader)';
      } else {
        setAuthMode(defaultMode);
      }
      m.classList.remove('hidden');
      m.classList.add('flex');
    }

    function closeAuthModal() {
      const m = document.getElementById('authModal');
      m.classList.add('hidden');
      m.classList.remove('flex');
    }

    function openUnlockModal(novelId, chId) {
      if (!state.user) { openAuthModal(); showToast('กรุณาเข้าสู่ระบบก่อนปลดล็อกตอน'); return; }
      const novel = getNovel(novelId);
      const ch = (novel?.chapters || []).find(c => c.id === chId);
      if (!ch) return;
      if ((state.user.coin_balance || 0) < ch.price_coins) {
        state.pendingUnlock = { novelId, chId };
        openTopup(`ตอนที่ ${ch.chapter_number} ใช้ ${ch.price_coins} เหรียญ (คุณมี ${state.user.coin_balance || 0} เหรียญ)`);
        return;
      }
      state.pendingUnlock = { novelId, chId };
      document.getElementById('unlockTitle').textContent = `ปลดล็อกตอนที่ ${ch.chapter_number}: ${ch.title}`;
      document.getElementById('unlockDesc').innerHTML = `ใช้ <strong>${ch.price_coins} เหรียญ</strong> เพื่อปลดล็อกอ่านตลอดไป<br>คงเหลือหลังปลดล็อก: <strong>${(state.user.coin_balance - ch.price_coins).toLocaleString()} เหรียญ</strong>`;
      const m = document.getElementById('unlockModal');
      m.classList.remove('hidden');
      m.classList.add('flex');
    }

    function closeUnlockModal() {
      const m = document.getElementById('unlockModal');
      m.classList.add('hidden');
      m.classList.remove('flex');
    }

    function openChapter(chId) {
      const novel = getNovel(state.activeNovelId);
      const ch = (novel?.chapters || []).find(c => c.id === chId);
      if (!ch) return;
      if (isAccessible(ch)) {
        state.activeChapterId = ch.id;
        state.view = 'reader';
        window.scrollTo({ top: 0, behavior: 'smooth' });
        render();
      } else {
        openUnlockModal(novel.id, ch.id);
      }
    }

    function bindDynamic() {
      document.querySelectorAll('[data-open-novel]').forEach(el => {
        el.addEventListener('click', () => {
          state.activeNovelId = el.getAttribute('data-open-novel');
          state.view = 'novel';
          window.scrollTo({ top: 0, behavior: 'smooth' });
          render();
        });
      });

      document.querySelectorAll('[data-open-ch]').forEach(el => {
        el.addEventListener('click', () => openChapter(el.getAttribute('data-open-ch')));
      });

      document.querySelectorAll('#mainContent [data-view]').forEach(el => {
        el.addEventListener('click', () => { state.view = el.getAttribute('data-view'); state.activeCategory = null; render(); });
      });

      document.querySelectorAll('[data-go-admin-tab]').forEach(btn => {
        btn.addEventListener('click', () => { state.view = 'admin'; state.adminTab = btn.getAttribute('data-go-admin-tab'); render(); });
      });

      document.querySelectorAll('[data-admin-tab]').forEach(btn => {
        btn.addEventListener('click', () => { state.adminTab = btn.getAttribute('data-admin-tab'); render(); });
      });

      document.querySelectorAll('[data-rank-filter]').forEach(btn => {
        btn.addEventListener('click', () => { state.rankFilter = btn.getAttribute('data-rank-filter'); render(); });
      });

      document.querySelectorAll('[data-cat]').forEach(btn => {
        btn.addEventListener('click', () => { state.activeCategory = btn.getAttribute('data-cat'); window.scrollTo({ top: 0, behavior: 'smooth' }); render(); });
      });

      document.querySelectorAll('[data-toggle-bm]').forEach(btn => {
        btn.addEventListener('click', async () => {
          const nid = btn.getAttribute('data-toggle-bm');
          const exists = state.bookmarks.includes(nid);
          if (state.isLive && state.user) {
            await sb.from('bookmarks_progress').upsert({ user_id: state.user.id, novel_id: nid, is_bookmarked: !exists });
          }
          state.bookmarks = exists ? state.bookmarks.filter(b => b !== nid) : [...state.bookmarks, nid];
          saveDemo();
          render();
          showToast(exists ? 'นำออกจากคลังแล้ว' : 'บันทึกเข้าคลังแล้ว');
        });
      });

      document.querySelectorAll('[data-rtheme]').forEach(btn => {
        btn.addEventListener('click', () => { state.readTheme = btn.getAttribute('data-rtheme'); saveDemo(); render(); });
      });

      document.querySelectorAll('#mainContent [data-set-mode]').forEach(btn => {
        btn.addEventListener('click', () => { state.mode = btn.getAttribute('data-set-mode'); saveDemo(); render(); });
      });

      const clearBtn = document.getElementById('clearFilterBtn');
      if (clearBtn) clearBtn.addEventListener('click', () => { state.activeCategory = null; state.searchQuery = ''; document.getElementById('searchInput').value = ''; render(); });

      const promoBtn = document.getElementById('promoTopupBtn');
      if (promoBtn) promoBtn.addEventListener('click', () => openTopup());

      const libTopup = document.getElementById('libTopupBtn');
      if (libTopup) libTopup.addEventListener('click', () => openTopup());

      const fDown = document.getElementById('fontDownBtn') || document.getElementById('setFontDown');
      if (fDown) fDown.addEventListener('click', () => { state.fontSize = Math.max(14, state.fontSize - 2); saveDemo(); render(); });

      const fUp = document.getElementById('fontUpBtn') || document.getElementById('setFontUp');
      if (fUp) fUp.addEventListener('click', () => { state.fontSize = Math.min(26, state.fontSize + 2); saveDemo(); render(); });

      // Admin: Add Novel
      const addNovelForm = document.getElementById('addNovelForm');
      if (addNovelForm) addNovelForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        try {
          const coverFile = document.getElementById('nCoverFile').files[0];
          const coverUrl = coverFile ? await uploadImageFile(coverFile, 'media') : '';
          const payload = {
            title: document.getElementById('nTitle').value.trim(),
            author: document.getElementById('nAuthor').value.trim() || 'GoldNovel',
            synopsis: document.getElementById('nSynopsis').value.trim(),
            cover_url: coverUrl,
            categories: [document.getElementById('nCategory').value],
            audience: document.getElementById('nAudience').value,
            status: document.getElementById('nStatus').value,
            views: 0,
            is_featured: false
          };
          if (state.isLive) {
            const { error } = await sb.from('novels').insert(payload);
            if (error) throw error;
            await loadLiveData();
          } else {
            state.novels.unshift({ ...payload, id: 'n-' + Date.now(), chapters: [] });
            saveDemo();
          }
          render();
          showToast('เพิ่มนิยายใหม่เรียบร้อยแล้ว!');
        } catch (err) {
          showToast('เกิดข้อผิดพลาด: ' + err.message);
        }
      });

      // Admin: Change Cover
      document.querySelectorAll('[data-change-cover]').forEach(input => {
        input.addEventListener('change', async () => {
          const nid = input.getAttribute('data-change-cover');
          const file = input.files[0];
          if (!file) return;
          try {
            const url = await uploadImageFile(file, 'media');
            if (state.isLive) {
              await sb.from('novels').update({ cover_url: url }).eq('id', nid);
              await loadLiveData();
            } else {
              const target = state.novels.find(n => n.id === nid);
              if (target) target.cover_url = url;
              saveDemo();
            }
            render();
            showToast('อัปโหลดรูปปกใหม่เรียบร้อย!');
          } catch (err) { showToast('อัปโหลดไม่สำเร็จ: ' + err.message); }
        });
      });

      // Admin: Delete Novel
      document.querySelectorAll('[data-del-novel]').forEach(btn => {
        btn.addEventListener('click', async () => {
          const nid = btn.getAttribute('data-del-novel');
          if (state.isLive) {
            await sb.from('novels').delete().eq('id', nid);
            await loadLiveData();
          } else {
            state.novels = state.novels.filter(n => n.id !== nid);
            saveDemo();
          }
          render();
          showToast('ลบนิยายเรียบร้อย');
        });
      });

      // Admin: Add Chapter
      const addChForm = document.getElementById('addChapterForm');
      if (addChForm) addChForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        try {
          const nid = document.getElementById('chNovelId').value;
          const payload = {
            novel_id: nid,
            chapter_number: Number(document.getElementById('chNum').value),
            title: document.getElementById('chTitle').value.trim(),
            price_coins: Number(document.getElementById('chPrice').value || 0),
            content: document.getElementById('chContent').value.trim()
          };
          if (state.isLive) {
            const { error } = await sb.from('chapters').insert(payload);
            if (error) throw error;
            await loadLiveData();
          } else {
            const novel = state.novels.find(n => n.id === nid);
            if (novel) {
              novel.chapters = novel.chapters || [];
              novel.chapters.push({ ...payload, id: 'ch-' + Date.now() });
              novel.chapters.sort((a, b) => a.chapter_number - b.chapter_number);
            }
            saveDemo();
          }
          render();
          showToast('เผยแพร่ตอนนิยายเรียบร้อย!');
        } catch (err) { showToast('บันทึกไม่สำเร็จ: ' + err.message); }
      });

      // Admin: Update Banners
      const bannerForm = document.getElementById('bannerForm');
      if (bannerForm) bannerForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        try {
          const heroFile = document.getElementById('bHeroFile').files[0];
          const promoFile = document.getElementById('bPromoFile').files[0];
          const nextSettings = {
            ...state.settings,
            hero_title: document.getElementById('bHeroTitle').value.trim(),
            hero_tagline: document.getElementById('bHeroTagline').value.trim(),
            promo_title: document.getElementById('bPromoTitle').value.trim(),
            promo_subtitle: document.getElementById('bPromoSub').value.trim()
          };
          if (heroFile) nextSettings.hero_banner_url = await uploadImageFile(heroFile, 'media');
          if (promoFile) nextSettings.promo_banner_url = await uploadImageFile(promoFile, 'media');

          if (state.isLive) {
            await sb.from('site_settings').update(nextSettings).eq('id', 'main');
            await loadLiveData();
          } else {
            state.settings = nextSettings;
            saveDemo();
          }
          render();
          showToast('อัปเดตแบนเนอร์และโปรโมชันเรียบร้อย!');
        } catch (err) { showToast('อัปเดตไม่สำเร็จ: ' + err.message); }
      });

      // Admin: Approve Top-Up
      document.querySelectorAll('[data-approve-tx]').forEach(btn => {
        btn.addEventListener('click', async () => {
          const txId = btn.getAttribute('data-approve-tx');
          try {
            if (state.isLive) {
              const { error } = await sb.rpc('approve_topup', { p_tx_id: txId });
              if (error) throw error;
              await loadLiveData();
            } else {
              const tx = state.transactions.find(t => t.id === txId);
              if (tx && tx.status === 'pending') {
                tx.status = 'approved';
                state.user.coin_balance += tx.coins_delta;
              }
              saveDemo();
            }
            render();
            showToast('อนุมัติและเติมเหรียญเข้าบัญชีแล้ว!');
          } catch (err) { showToast('อนุมัติไม่สำเร็จ: ' + err.message); }
        });
      });
    }

    // Static listeners
    document.querySelectorAll('aside [data-view]').forEach(btn => {
      btn.addEventListener('click', () => { state.view = btn.getAttribute('data-view'); state.activeCategory = null; render(); });
    });

    document.querySelectorAll('[data-top-tab]').forEach(btn => {
      btn.addEventListener('click', () => {
        const t = btn.getAttribute('data-top-tab');
        state.activeCategory = null;
        state.view = 'home';
        render();
        if (t === 'categories') document.getElementById('categoriesSection')?.scrollIntoView({ behavior: 'smooth' });
        else if (t === 'ranking') document.getElementById('rankingSection')?.scrollIntoView({ behavior: 'smooth' });
        else if (t === 'promo') document.getElementById('promoSection')?.scrollIntoView({ behavior: 'smooth' });
      });
    });

    document.querySelectorAll('aside [data-set-mode], #mobileDrawer [data-set-mode]').forEach(btn => {
      btn.addEventListener('click', () => { state.mode = btn.getAttribute('data-set-mode'); saveDemo(); applyChrome(); });
    });

    document.getElementById('searchInput').addEventListener('input', (e) => { state.searchQuery = e.target.value; state.view = 'home'; render(); });
    document.getElementById('sideTopupBtn').addEventListener('click', () => openTopup());
    document.getElementById('headerTopupBtn').addEventListener('click', () => openTopup());
    document.getElementById('closeTopupBtn').addEventListener('click', closeTopup);
    document.getElementById('authHeaderBtn').addEventListener('click', openAuthModal);
    document.getElementById('closeAuthBtn').addEventListener('click', closeAuthModal);

    // Mobile drawer
    const drawer = document.getElementById('mobileDrawer');
    document.getElementById('mobileMenuBtn').addEventListener('click', () => drawer.classList.remove('hidden'));
    document.getElementById('closeDrawerBtn').addEventListener('click', () => drawer.classList.add('hidden'));
    document.getElementById('mobileBackdrop').addEventListener('click', () => drawer.classList.add('hidden'));
    document.querySelectorAll('[data-mview]').forEach(btn => {
      btn.addEventListener('click', () => { state.view = btn.getAttribute('data-mview'); drawer.classList.add('hidden'); render(); });
    });
    document.getElementById('mobileTopupBtn').addEventListener('click', () => { drawer.classList.add('hidden'); openTopup(); });

    // Auth actions
    document.getElementById('tabLoginBtn').addEventListener('click', () => setAuthMode('login'));
    document.getElementById('tabSignupBtn').addEventListener('click', () => setAuthMode('signup'));

    document.getElementById('googleLoginBtn').addEventListener('click', async () => {
      if (!state.isLive) {
        state.user = { id: 'demo-admin', email: 'google.user@gmail.com', display_name: 'Google User (ทดลอง)', role: 'admin', coin_balance: state.user?.coin_balance || 0 };
        saveDemo();
        closeAuthModal();
        render();
        showToast('เข้าสู่ระบบด้วย Google (โหมดทดลอง) สำเร็จ');
        return;
      }
      const { error } = await sb.auth.signInWithOAuth({
        provider: 'google',
        options: { redirectTo: window.location.origin }
      });
      if (error) showToast('เชื่อมต่อ Google ไม่สำเร็จ: ' + error.message);
    });

    document.getElementById('authForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('authEmail').value.trim();
      const password = document.getElementById('authPassword').value;
      const displayName = document.getElementById('authDisplayName').value.trim() || email.split('@')[0];

      if (authMode === 'signup') {
        const confirmPw = document.getElementById('authConfirmPassword').value;
        if (password !== confirmPw) { showToast('รหัสผ่านทั้งสองช่องไม่ตรงกัน'); return; }
        if (!state.isLive) {
          state.user = { id: 'demo-admin', email, display_name: displayName, role: 'admin', coin_balance: 0 };
          saveDemo();
          closeAuthModal();
          render();
          showToast('สมัครสมาชิกและเข้าสู่ระบบสำเร็จ!');
          return;
        }
        const { data, error } = await sb.auth.signUp({
          email,
          password,
          options: { data: { display_name: displayName } }
        });
        if (error) { showToast('สมัครไม่สำเร็จ: ' + error.message); return; }
        if (data?.session) {
          await loadLiveData();
          closeAuthModal();
          render();
          showToast('สมัครสมาชิกและเข้าสู่ระบบเรียบร้อย!');
        } else {
          setAuthMode('login');
          showToast('สมัครสมาชิกสำเร็จ! กรุณายืนยันอีเมลหรือกดเข้าสู่ระบบได้เลย');
        }
        return;
      }

      if (!state.isLive) {
        state.user = { id: 'demo-admin', email, display_name: email.split('@')[0], role: 'admin', coin_balance: state.user?.coin_balance || 0 };
        saveDemo();
        closeAuthModal();
        render();
        showToast('เข้าสู่ระบบโหมดทดลองสำเร็จ');
        return;
      }
      const { error } = await sb.auth.signInWithPassword({ email, password });
      if (error) { showToast('เข้าสู่ระบบไม่สำเร็จ: ' + error.message); return; }
      await loadLiveData();
      closeAuthModal();
      render();
      showToast('เข้าสู่ระบบสำเร็จ!');
    });

    document.getElementById('logoutBtn').addEventListener('click', async () => {
      if (state.isLive) await sb.auth.signOut();
      state.user = null;
      state.view = 'home';
      closeAuthModal();
      render();
      showToast('ออกจากระบบแล้ว');
    });

    // Topup flow
    document.querySelectorAll('.pay-opt').forEach(btn => {
      btn.addEventListener('click', () => { state.selectedPay = btn.getAttribute('data-pay'); renderPayOpts(); });
    });

    document.getElementById('goPayStepBtn').addEventListener('click', () => {
      const coins = calcCoins(state.selectedBaht);
      document.getElementById('payChannelLabel').textContent = state.selectedPay === 'promptpay' ? 'PromptPay (พร้อมเพย์)' : 'TrueMoney Wallet';
      document.getElementById('payAccountDetail').textContent = state.selectedPay === 'promptpay'
        ? `${CFG.promptpayNumber} (${CFG.promptpayAccountName})`
        : `เบอร์วอลเล็ท: ${CFG.truemoneyPhone}`;
      document.getElementById('payBahtText').textContent = `${state.selectedBaht} บาท`;
      document.getElementById('payCoinText').textContent = `รับ ${coins} เหรียญ`;
      document.getElementById('topupStep1').classList.add('hidden');
      document.getElementById('topupStep2').classList.remove('hidden');
    });

    document.getElementById('backPayBtn').addEventListener('click', () => {
      document.getElementById('topupStep2').classList.add('hidden');
      document.getElementById('topupStep1').classList.remove('hidden');
    });

    document.getElementById('submitSlipBtn').addEventListener('click', async () => {
      const coins = calcCoins(state.selectedBaht);
      const slipFile = document.getElementById('slipFileInput').files[0];
      try {
        const slipUrl = slipFile ? await uploadImageFile(slipFile, 'slips') : '';
        if (state.isLive) {
          const { error } = await sb.from('transactions').insert({
            user_id: state.user.id,
            type: 'topup',
            amount_baht: state.selectedBaht,
            coins_delta: coins,
            payment_method: state.selectedPay,
            slip_url: slipUrl,
            note: `เติมเงิน ${state.selectedBaht} บาท (${state.selectedPay})`,
            status: 'pending'
          });
          if (error) throw error;
          await loadLiveData();
          closeTopup();
          render();
          showToast('ส่งสลิปเรียบร้อย! รอระบบตรวจสอบหรืออนุมัติในหน้า Admin');
        } else {
          state.user.coin_balance += coins;
          state.transactions.unshift({
            id: 'tx-' + Date.now(),
            type: 'topup',
            amount_baht: state.selectedBaht,
            coins_delta: coins,
            payment_method: state.selectedPay,
            note: `เติมเงิน ${state.selectedBaht} บาท (${state.selectedPay})`,
            status: 'approved'
          });
          saveDemo();
          closeTopup();
          render();
          showToast(`เติมสำเร็จ! รับ ${coins} เหรียญแล้ว`);
          if (state.pendingUnlock) {
            const p = state.pendingUnlock;
            state.pendingUnlock = null;
            openUnlockModal(p.novelId, p.chId);
          }
        }
      } catch (err) { showToast('ส่งสลิปไม่สำเร็จ: ' + err.message); }
    });

    // Unlock confirm
    document.getElementById('cancelUnlockBtn').addEventListener('click', () => { state.pendingUnlock = null; closeUnlockModal(); });
    document.getElementById('confirmUnlockBtn').addEventListener('click', async () => {
      if (!state.pendingUnlock) return;
      const { novelId, chId } = state.pendingUnlock;
      const novel = getNovel(novelId);
      const ch = (novel?.chapters || []).find(c => c.id === chId);
      if (!ch) return;
      try {
        if (state.isLive) {
          const { error } = await sb.rpc('unlock_chapter', { p_chapter_id: ch.id });
          if (error) throw error;
          await loadLiveData();
        } else {
          state.user.coin_balance -= ch.price_coins;
          if (!state.unlockedIds.includes(ch.id)) state.unlockedIds.push(ch.id);
          state.transactions.unshift({ id: 'tx-' + Date.now(), type: 'unlock', coins_delta: -ch.price_coins, note: `ปลดล็อก: ${ch.title}`, status: 'approved' });
          saveDemo();
        }
        state.pendingUnlock = null;
        state.activeNovelId = novel.id;
        state.activeChapterId = ch.id;
        state.view = 'reader';
        closeUnlockModal();
        window.scrollTo({ top: 0, behavior: 'smooth' });
        render();
        showToast(`ปลดล็อกตอนที่ ${ch.chapter_number} สำเร็จ!`);
      } catch (err) { showToast('ปลดล็อกไม่สำเร็จ: ' + err.message); }
    });

    (async function init() {
      if (state.isLive) await loadLiveData();
      else loadDemo();
      render();
    })();
  </script>
</body>
</html>

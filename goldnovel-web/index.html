<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GoldNovel — แพลตฟอร์มอ่านนิยายออนไลน์</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Serif+Thai:wght@600;700;800&family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-app: #0D0F15;
      --bg-sidebar: #12151E;
      --bg-card: #171B26;
      --bg-input: #1C202D;
      --border-subtle: rgba(232, 197, 123, 0.16);
      --border-soft: rgba(255, 255, 255, 0.08);
      --text-main: #F3EFE6;
      --text-sub: #A7AAB6;
      --text-muted: #767A8A;
      --gold-1: #F3D999;
      --gold-2: #D4A857;
      --gold-soft: rgba(232, 197, 123, 0.14);
      --gold-glow: rgba(212, 168, 87, 0.25);
    }

    body[data-mode="light"] {
      --bg-app: #F6F2EA;
      --bg-sidebar: #EFE9DD;
      --bg-card: #FFFFFF;
      --bg-input: #F4EFE5;
      --border-subtle: rgba(156, 114, 43, 0.22);
      --border-soft: rgba(43, 40, 37, 0.1);
      --text-main: #25221E;
      --text-sub: #5E584F;
      --text-muted: #8C8478;
      --gold-1: #B88635;
      --gold-2: #8E6320;
      --gold-soft: rgba(184, 134, 53, 0.14);
      --gold-glow: rgba(184, 134, 53, 0.2);
    }

    body {
      font-family: 'Prompt', 'Inter', sans-serif;
      background-color: var(--bg-app);
      color: var(--text-main);
      transition: background-color 0.25s ease, color 0.25s ease;
      overflow-x: hidden;
    }

    .font-display-thai { font-family: 'Noto Serif Thai', 'Prompt', serif; }

    .card-panel {
      background-color: var(--bg-card);
      border: 1px solid var(--border-subtle);
    }

    .btn-gold {
      background: linear-gradient(135deg, #F3D999 0%, #D4A857 100%);
      color: #161410;
      font-weight: 600;
      box-shadow: 0 4px 16px var(--gold-glow);
      transition: transform 0.15s ease, filter 0.15s ease;
    }
    .btn-gold:hover { filter: brightness(1.06); transform: translateY(-1px); }

    .sidebar-item-active {
      background: linear-gradient(90deg, rgba(232, 197, 123, 0.22) 0%, rgba(212, 168, 87, 0.06) 100%);
      border: 1px solid rgba(232, 197, 123, 0.35);
      color: var(--gold-1);
    }

    .cover-placeholder {
      background: radial-gradient(circle at 30% 20%, rgba(232, 197, 123, 0.18), transparent 60%),
                  linear-gradient(160deg, #1E2436 0%, #11141D 100%);
    }

    .hero-placeholder {
      background: radial-gradient(circle at 80% 30%, rgba(232, 197, 123, 0.2), transparent 55%),
                  radial-gradient(circle at 15% 80%, rgba(79, 108, 170, 0.18), transparent 55%),
                  linear-gradient(135deg, #141926 0%, #0D1018 100%);
    }

    .promo-placeholder {
      background: radial-gradient(circle at 85% 50%, rgba(243, 217, 153, 0.26), transparent 55%),
                  linear-gradient(135deg, #211B13 0%, #14161F 100%);
    }

    .hero-text-gradient {
      background: linear-gradient(180deg, #FFF4D2 0%, #E7BF6D 65%, #C6933C 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .rank-1 { background: linear-gradient(135deg, #F6DC93, #C58F33); color: #1A1408; }
    .rank-2 { background: linear-gradient(135deg, #E2E8F0, #94A3B8); color: #0F172A; }
    .rank-3 { background: linear-gradient(135deg, #E5A978, #A86333); color: #1F1108; }
    .rank-n { background: rgba(15, 17, 23, 0.85); color: #E2E8F0; border: 1px solid rgba(255,255,255,0.16); }

    .reading-sheet[data-read-theme="dark"] { background-color: #151821; color: #E5E1D8; border-color: rgba(232, 197, 123, 0.14); }
    .reading-sheet[data-read-theme="warm"] { background-color: #FAF6EE; color: #2B2620; border-color: #E6DDD0; }
    .reading-sheet[data-read-theme="sepia"] { background-color: #F2E7D0; color: #362C20; border-color: #DECDB0; }

    .reading-prose p { margin-bottom: 1.45em; text-indent: 1.8em; line-height: 1.95; }
    .fade-in { animation: fadeIn 0.2s ease-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
  </style>
  <script src="config.js"></script>
</head>
<body data-mode="dark" class="min-h-screen flex">

  <!-- Left Sidebar (Desktop) -->
  <aside class="hidden lg:flex flex-col w-56 shrink-0 sticky top-0 h-screen border-r px-3.5 py-5 justify-between z-30" style="background-color: var(--bg-sidebar); border-color: var(--border-soft);">
    <div>
      <button type="button" data-view="home" class="w-full flex items-center gap-2.5 px-2 mb-7 text-left focus:outline-none">
        <div class="w-10 h-10 rounded-xl flex items-center justify-center shrink-0" style="background: radial-gradient(circle at top, rgba(243,217,153,0.22), rgba(212,168,87,0.05)); border: 1px solid var(--border-subtle);">
          <svg viewBox="0 0 36 36" class="w-7 h-7" fill="none" aria-hidden="true">
            <path d="M18 11C14.5 8.5 9.5 8 5.5 9.5V25.5C9.5 24 14.5 24.5 18 27C21.5 24.5 26.5 24 30.5 25.5V9.5C26.5 8 21.5 8.5 18 11Z" stroke="#E8C57B" stroke-width="2" stroke-linejoin="round"/>
            <path d="M18 11V27" stroke="#E8C57B" stroke-width="1.8"/>
            <path d="M18 5L19.2 7.8L22 9L19.2 10.2L18 13L16.8 10.2L14 9L16.8 7.8L18 5Z" fill="#F3D999"/>
          </svg>
        </div>
        <div>
          <div id="brandNameSide" class="text-base font-bold tracking-wide" style="color: var(--gold-1);">GoldNovel</div>
          <div id="modeBadgeSide" class="text-[10px] tracking-wider" style="color: var(--text-muted);">พร้อมเชื่อม Supabase</div>
        </div>
      </button>

      <nav class="space-y-1.5">
        <button type="button" data-view="home" class="side-nav w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm font-medium transition-all">
          <span>🏠</span><span>หน้าหลัก</span>
        </button>
        <button type="button" data-view="library" class="side-nav w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm font-medium transition-all">
          <span>📚</span><span>คลังของฉัน</span>
        </button>
        <button type="button" id="sideTopupBtn" class="side-nav w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm font-medium transition-all">
          <span>💳</span><span>การเติมเงิน</span>
        </button>
        <button type="button" data-view="settings" class="side-nav w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm font-medium transition-all">
          <span>⚙️</span><span>ตั้งค่า</span>
        </button>
        <div class="pt-3 mt-3 border-t" style="border-color: var(--border-soft);">
          <button type="button" id="sideAdminBtn" data-view="admin" class="side-nav w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm font-semibold transition-all">
            <span>✍️</span><span>หลังบ้านนักเขียน</span>
          </button>
        </div>
      </nav>
    </div>

    <div class="pt-4 border-t" style="border-color: var(--border-soft);">
      <div class="flex items-center justify-between p-1 rounded-full" style="background-color: var(--bg-input); border: 1px solid var(--border-soft);">
        <button type="button" data-set-mode="light" class="mode-pill flex-1 py-1.5 rounded-full text-xs font-medium">☀️ สว่าง</button>
        <button type="button" data-set-mode="dark" class="mode-pill flex-1 py-1.5 rounded-full text-xs font-medium">🌙 มืด</button>
      </div>
    </div>
  </aside>

  <!-- Right Main Area -->
  <div class="flex-1 min-w-0 flex flex-col">
    <!-- Top Header -->
    <header class="sticky top-0 z-20 backdrop-blur-md border-b px-4 sm:px-6 h-16 flex items-center justify-between gap-3" style="background-color: color-mix(in srgb, var(--bg-app) 88%, transparent); border-color: var(--border-soft);">
      <div class="flex items-center gap-3 lg:gap-5 min-w-0">
        <button type="button" id="mobileMenuBtn" class="lg:hidden w-9 h-9 rounded-xl flex items-center justify-center text-base" style="background-color: var(--bg-card); border: 1px solid var(--border-soft);">☰</button>
        <nav class="hidden md:flex items-center gap-5 text-sm font-medium">
          <button type="button" data-top-tab="home" class="top-tab py-5 border-b-2 transition-colors">หน้าหลัก</button>
          <button type="button" data-top-tab="categories" class="top-tab py-5 border-b-2 transition-colors">หมวดหมู่</button>
          <button type="button" data-top-tab="ranking" class="top-tab py-5 border-b-2 transition-colors">อันดับยอดนิยม</button>
          <button type="button" data-top-tab="promo" class="top-tab py-5 border-b-2 transition-colors">โปรโมชั่น</button>
        </nav>
      </div>

      <div class="flex items-center gap-2 sm:gap-3">
        <div class="relative w-36 sm:w-60">
          <input id="searchInput" type="text" placeholder="ค้นหานิยาย ชื่อเรื่อง..." class="w-full rounded-full pl-3.5 pr-8 py-1.5 text-xs sm:text-sm focus:outline-none" style="background-color: var(--bg-input); border: 1px solid var(--border-soft); color: var(--text-main);">
          <span class="absolute right-3 top-1/2 -translate-y-1/2 text-xs pointer-events-none" style="color: var(--text-muted);">🔍</span>
        </div>

        <button type="button" id="headerTopupBtn" class="flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs sm:text-sm font-semibold shrink-0" style="background-color: var(--gold-soft); border: 1px solid var(--border-subtle); color: var(--gold-1);">
          <span>🪙</span><span id="coinBalanceText">0</span>
        </button>

        <button type="button" id="authHeaderBtn" class="px-3.5 py-1.5 rounded-full text-xs font-semibold shrink-0" style="background-color: var(--bg-card); border: 1px solid var(--border-subtle); color: var(--text-main);">เข้าสู่ระบบ</button>
      </div>
    </header>

    <!-- Mobile Drawer -->
    <div id="mobileDrawer" class="fixed inset-0 z-40 hidden lg:hidden">
      <div id="mobileBackdrop" class="absolute inset-0 bg-black/60"></div>
      <div class="relative w-64 h-full p-5 flex flex-col justify-between" style="background-color: var(--bg-sidebar);">
        <div>
          <div class="flex items-center justify-between mb-6">
            <span class="text-lg font-bold" style="color: var(--gold-1);">GoldNovel</span>
            <button type="button" id="closeDrawerBtn" class="w-8 h-8 rounded-lg" style="background-color: var(--bg-card);">✕</button>
          </div>
          <nav class="space-y-1.5">
            <button type="button" data-mview="home" class="w-full text-left px-3.5 py-2.5 rounded-xl text-sm flex items-center gap-3"><span>🏠</span>หน้าหลัก</button>
            <button type="button" data-mview="library" class="w-full text-left px-3.5 py-2.5 rounded-xl text-sm flex items-center gap-3"><span>📚</span>คลังของฉัน</button>
            <button type="button" id="mobileTopupBtn" class="w-full text-left px-3.5 py-2.5 rounded-xl text-sm flex items-center gap-3"><span>💳</span>การเติมเงิน</button>
            <button type="button" data-mview="settings" class="w-full text-left px-3.5 py-2.5 rounded-xl text-sm flex items-center gap-3"><span>⚙️</span>ตั้งค่า</button>
            <button type="button" id="mobileAdminBtn" data-mview="admin" class="w-full text-left px-3.5 py-2.5 rounded-xl text-sm font-semibold flex items-center gap-3" style="color: var(--gold-1);"><span>✍️</span>หลังบ้านนักเขียน</button>
          </nav>
        </div>
        <div class="flex gap-2 pt-4 border-t" style="border-color: var(--border-soft);">
          <button type="button" data-set-mode="light" class="mode-pill flex-1 py-2 rounded-lg text-xs">☀️ สว่าง</button>
          <button type="button" data-set-mode="dark" class="mode-pill flex-1 py-2 rounded-lg text-xs">🌙 มืด</button>
        </div>
      </div>
    </div>

    <main id="mainContent" class="flex-1 p-4 sm:p-6 max-w-[1360px] w-full mx-auto"></main>
  </div>

  <!-- Auth Modal -->
  <div id="authModal" class="fixed inset-0 z-50 hidden items-center justify-center p-4 bg-black/70 backdrop-blur-xs">
    <div class="card-panel rounded-2xl max-w-sm w-full p-6 shadow-2xl fade-in">
      <div class="flex items-center justify-between mb-4">
        <h2 id="authModalTitle" class="text-lg font-bold">เข้าสู่ระบบ GoldNovel</h2>
        <button type="button" id="closeAuthBtn" class="w-8 h-8 rounded-full text-sm" style="background-color: var(--bg-input);">✕</button>
      </div>
      <div id="authUserInfo" class="hidden space-y-4">
        <div class="p-4 rounded-xl text-sm" style="background-color: var(--bg-input);">
          <div class="text-xs" style="color: var(--text-muted);">บัญชีปัจจุบัน</div>
          <div id="authEmailDisplay" class="font-semibold mt-0.5"></div>
          <div id="authRoleDisplay" class="text-xs mt-1" style="color: var(--gold-1);"></div>
        </div>
        <button type="button" id="logoutBtn" class="w-full py-2.5 rounded-xl text-sm font-semibold text-rose-400" style="background-color: rgba(244,63,94,0.14);">ออกจากระบบ</button>
      </div>
      <div id="authFormsWrap">
        <div class="grid grid-cols-2 gap-1.5 p-1 rounded-xl mb-4" style="background-color: var(--bg-input);">
          <button type="button" id="tabLoginBtn" class="py-2 rounded-lg text-xs font-semibold transition-all">เข้าสู่ระบบ</button>
          <button type="button" id="tabSignupBtn" class="py-2 rounded-lg text-xs font-semibold transition-all">สมัครสมาชิก</button>
        </div>
        <form id="authForm" class="space-y-3">
          <div id="signupNameWrap" class="hidden">
            <label class="block text-xs mb-1" style="color: var(--text-sub);">ชื่อที่แสดง (นามปากกา / ชื่อเล่น)</label>
            <input id="authDisplayName" type="text" placeholder="เช่น นักอ่านนิยาย" class="w-full px-3.5 py-2.5 rounded-xl text-sm focus:outline-none" style="background-color: var(--bg-input); border: 1px solid var(--border-soft); color: var(--text-main);">
          </div>
          <div>
            <label class="block text-xs mb-1" style="color: var(--text-sub);">อีเมล</label>
            <input id="authEmail" type="email" required placeholder="you@example.com" class="w-full px-3.5 py-2.5 rounded-xl text-sm focus:outline-none" style="background-color: var(--bg-input); border: 1px solid var(--border-soft); color: var(--text-main);">
          </div>
          <div>
            <label class="block text-xs mb-1" style="color: var(--text-sub);">รหัสผ่าน (อย่างน้อย 6 ตัวอักษร)</label>
            <input id="authPassword" type="password" required minlength="6" placeholder="••••••••" class="w-full px-3.5 py-2.5 rounded-xl text-sm focus:outline-none" style="background-color: var(--bg-input); border: 1px solid var(--border-soft); color: var(--text-main);">
          </div>
          <div id="signupConfirmWrap" class="hidden">
            <label class="block text-xs mb-1" style="color: var(--text-sub);">ยืนยันรหัสผ่านอีกครั้ง</label>
            <input id="authConfirmPassword" type="password" placeholder="••••••••" class="w-full px-3.5 py-2.5 rounded-xl text-sm focus:outline-none" style="background-color: var(--bg-input); border: 1px solid var(--border-soft); color: var(--text-main);">
          </div>
          <div class="pt-2">
            <button type="submit" id="authSubmitBtn" class="w-full py-2.5 rounded-xl text-sm btn-gold">เข้าสู่ระบบ</button>
          </div>
        </form>
        <div class="flex items-center gap-3 my-4">
          <div class="h-px flex-1" style="background-color: var(--border-soft);"></div>
          <span class="text-[11px]" style="color: var(--text-muted);">หรือ</span>
          <div class="h-px flex-1" style="background-color: var(--border-soft);"></div>
        </div>
        <button type="button" id="googleLoginBtn" class="w-full py-2.5 px-4 rounded-xl text-sm font-medium flex items-center justify-center gap-2.5 transition-opacity hover:opacity-90" style="background-color: #FFFFFF; color: #1F1F1F; border: 1px solid #DADCE0;">
          <svg viewBox="0 0 24 24" class="w-4 h-4 shrink-0" aria-hidden="true">
            <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z"/>
            <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.11-6.72-4.96H1.29v3.14C3.26 21.3 7.31 24 12 24z"/>
            <path fill="#FBBC05" d="M5.28 14.24c-.24-.72-.38-1.49-.38-2.24s.14-1.52.38-2.24V6.62H1.29C.47 8.24 0 10.06 0 12s.47 3.76 1.29 5.38l3.99-3.14z"/>
            <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.31 0 3.26 2.7 1.29 6.62l3.99 3.14c.95-2.85 3.6-4.96 6.72-4.96z"/>
          </svg>
          <span>ดำเนินการต่อด้วย Google</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Top-Up Modal -->
  <div id="topupModal" class="fixed inset-0 z-50 hidden items-center justify-center p-4 bg-black/70 backdrop-blur-xs">
    <div class="card-panel rounded-2xl max-w-md w-full p-6 shadow-2xl fade-in max-h-[90vh] overflow-y-auto">
      <div class="flex items-start justify-between gap-3 mb-4">
        <div>
          <span id="topupBonusBadge" class="inline-block text-[11px] font-semibold px-2.5 py-0.5 rounded-full mb-1.5" style="background-color: var(--gold-soft); color: var(--gold-1);">โปรโมชั่นโบนัส +20%</span>
          <h2 class="text-xl font-bold">เติมเหรียญ GoldNovel</h2>
          <p id="topupSubtext" class="text-xs mt-0.5" style="color: var(--text-sub);">รองรับ PromptPay และ TrueMoney Wallet</p>
        </div>
        <button type="button" id="closeTopupBtn" class="w-8 h-8 rounded-full text-sm" style="background-color: var(--bg-input);">✕</button>
      </div>

      <div id="topupStep1">
        <div class="text-xs font-medium mb-2" style="color: var(--text-muted);">1. เลือกจำนวนเงิน</div>
        <div id="pkgGrid" class="grid grid-cols-3 gap-2.5 mb-5"></div>

        <div class="text-xs font-medium mb-2" style="color: var(--text-muted);">2. เลือกช่องทางชำระเงิน</div>
        <div class="grid grid-cols-2 gap-2.5 mb-5">
          <button type="button" data-pay="promptpay" class="pay-opt p-3 rounded-xl border text-left">
            <div class="text-sm font-semibold">PromptPay</div>
            <div class="text-[11px] mt-0.5" style="color: var(--text-sub);">โอนพร้อมเพย์ทุกธนาคาร</div>
          </button>
          <button type="button" data-pay="truemoney" class="pay-opt p-3 rounded-xl border text-left">
            <div class="text-sm font-semibold">TrueMoney Wallet</div>
            <div class="text-[11px] mt-0.5" style="color: var(--text-sub);">โอนเข้าวอลเล็ท</div>
          </button>
        </div>
        <button type="button" id="goPayStepBtn" class="w-full py-3 rounded-xl text-sm btn-gold">ดำเนินการชำระเงิน</button>
      </div>

      <div id="topupStep2" class="hidden space-y-4">
        <div class="rounded-2xl p-4 text-center" style="background-color: var(--bg-input); border: 1px solid var(--border-subtle);">
          <div id="payChannelLabel" class="text-xs font-semibold uppercase tracking-wider mb-1" style="color: var(--gold-1);">PromptPay</div>
          <div id="payAccountDetail" class="text-sm font-medium mb-2"></div>
          <div id="payBahtText" class="text-2xl font-bold">100 บาท</div>
          <div id="payCoinText" class="text-xs mt-1" style="color: var(--gold-1);">รับ 120 เหรียญ</div>
        </div>

        <div>
          <label class="block text-xs font-medium mb-1.5" style="color: var(--text-sub);">แนบรูปสลิปการโอนเงิน</label>
          <input id="slipFileInput" type="file" accept="image/*" class="w-full text-xs p-2.5 rounded-xl" style="background-color: var(--bg-input); border: 1px dashed var(--border-subtle);">
        </div>

        <button type="button" id="submitSlipBtn" class="w-full py-3 rounded-xl text-sm btn-gold">ยืนยันการโอนเงิน / ส่งสลิป</button>
        <button type="button" id="backPayBtn" class="w-full py-1.5 text-xs" style="color: var(--text-sub);">← เปลี่ยนจำนวนเงินหรือช่องทาง</button>
      </div>
    </div>
  </div>

  <!-- Unlock Confirm Modal -->
  <div id="unlockModal" class="fixed inset-0 z-50 hidden items-center justify-center p-4 bg-black/70 backdrop-blur-xs">
    <div class="card-panel rounded-2xl max-w-sm w-full p-6 shadow-2xl fade-in">
      <div class="text-xs font-semibold uppercase tracking-wider mb-1" style="color: var(--gold-1);">ปลดล็อกรายตอน</div>
      <h3 id="unlockTitle" class="text-lg font-bold mb-2">ยืนยันการปลดล็อก</h3>
      <p id="unlockDesc" class="text-sm mb-5 leading-relaxed" style="color: var(--text-sub);"></p>
      <div class="flex gap-2.5">
        <button type="button" id="cancelUnlockBtn" class="flex-1 py-2.5 rounded-xl text-sm" style="background-color: var(--bg-input);">ยกเลิก</button>
        <button type="button" id="confirmUnlockBtn" class="flex-1 py-2.5 rounded-xl text-sm btn-gold">ปลดล็อกเลย</button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="fixed bottom-5 right-5 z-50 hidden px-4 py-3 rounded-xl shadow-2xl text-sm font-medium fade-in" style="background: linear-gradient(135deg, #F3D999, #D4A857); color: #161410;"></div>

  <script>
    const CFG = Object.assign({
      siteName: "GoldNovel",
      supabaseUrl: "",
      supabaseAnonKey: "",
      promptpayNumber: "08X-XXX-XXXX",
      promptpayAccountName: "ชื่อบัญชีของคุณ (ตั้งค่าใน config.js)",
      truemoneyPhone: "08X-XXX-XXXX",
      topupBonusPercent: 20
    }, window.GOLDNOVEL_CONFIG || {});

    const CATEGORIES = ['กำลังภายใน', 'ระบบ', 'แฟนตาซี', 'แอ็กชัน', 'เกิดใหม่', 'ต่างโลก', 'สยองขวัญ', 'โรแมนติก'];
    const PACKAGES = [50, 100, 300];

    const sb = (CFG.supabaseUrl && CFG.supabaseAnonKey && window.supabase)
      ? window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey)
      : null;

    const DEFAULT_DEMO_NOVELS = [
      {
        id: 'demo-1',
        title: 'มรรคาเหนือหล้า มหาปราชญ์แห่งยุทธภพ',
        author: 'นามปากกาของคุณ',
        synopsis: 'เรื่องตัวอย่างสำหรับทดสอบระบบ คุณสามารถเข้าไปแก้ไขชื่อเรื่อง อัปโหลดรูปปกของคุณเอง หรือลบเรื่องนี้ได้ในหน้า "หลังบ้านนักเขียน"',
        cover_url: '',
        categories: ['กำลังภายใน', 'แฟนตาซี'],
        audience: 'ชาย',
        status: 'กำลังอัปเดต',
        views: 1240,
        is_featured: true,
        chapters: [
          { id: 'c1-1', chapter_number: 1, title: 'บทนำ: จุดเริ่มต้นแห่งตำนาน', price_coins: 0, content: 'นี่คือเนื้อหาตัวอย่างตอนที่ 1 (อ่านฟรี)\n\nคุณสามารถกดเข้าไปที่เมนู "หลังบ้านนักเขียน" ด้านซ้าย เพื่อทดลองอัปโหลดรูปปกนิยาย เปลี่ยนรูปแบนเนอร์ และเพิ่มตอนนิยายของคุณเองได้ทันทีครับ' },
          { id: 'c1-2', chapter_number: 2, title: 'การตื่นรู้ของเส้นลมปราณ', price_coins: 1, content: 'ปลดล็อกตอนที่ 2 สำเร็จ!\n\nเมื่อเชื่อมกับ Supabase จริง ระบบจะบันทึกสิทธิ์การปลดล็อกนี้ผูกกับบัญชีสมาชิกของผู้อ่าน ทำให้กลับมาอ่านซ้ำได้ตลอดไปโดยไม่หักเหรียญซ้ำครับ' }
        ]
      },
      {
        id: 'demo-2',
        title: 'หายนะโลกยุคน้ำแข็ง ผมกักตุนเสบียงทั้งหมด',
        author: 'นามปากกาของคุณ',
        synopsis: 'เมื่อโลกเข้าสู่ยุคน้ำแข็ง เขากลับได้รับระบบคลังเสบียงไร้ขีดจำกัด (อัปโหลดรูปปกของคุณเองได้ในหน้าหลังบ้านนักเขียน)',
        cover_url: '',
        categories: ['ระบบ', 'แอ็กชัน', 'เกิดใหม่'],
        audience: 'ชาย',
        status: 'จบแล้ว',
        views: 980,
        is_featured: false,
        chapters: [
          { id: 'c2-1', chapter_number: 1, title: 'ย้อนเวลาก่อนหิมะแรก 30 วัน', price_coins: 0, content: 'ตัวอย่างตอนที่ 1 สำหรับทดสอบระบบอ่านและการปรับขนาดตัวอักษร รวมถึงโหมดถนอมสายตา (มืด / กระดาษอุ่น / Sepia)' },
          { id: 'c2-2', chapter_number: 2, title: 'คลังเสบียงมิติลับ', price_coins: 1, content: 'ปลดล็อกตอนที่ 2 เรียบร้อย! ระบบตัดเหรียญและเปิดเนื้อหาให้อ่านทันที' }
        ]
      }
    ];

    let state = {
      isLive: !!sb,
      mode: 'dark',
      readTheme: 'dark',
      fontSize: 18,
      view: 'home', // home | novel | reader | library | settings | admin
      adminTab: 'novels', // novels | chapters | banners | topups
      rankFilter: 'ทั้งหมด',
      activeCategory: null,
      searchQuery: '',
      activeNovelId: null,
      activeChapterId: null,
      selectedBaht: 100,
      selectedPay: 'promptpay',
      pendingUnlock: null,
      user: sb ? null : { id: 'demo-admin', email: 'owner@goldnovel.demo', display_name: 'เจ้าของเว็บ (โหมดทดลอง)', role: 'admin', coin_balance: 0 },
      settings: {
        hero_title: 'มรรคาเหนือหล้า มหาปราชญ์แห่งยุทธภพ',
        hero_tagline: 'เมื่อก้าวข้ามขีดจำกัด... จักกลายเป็นผู้ยืนอยู่เหนือฟ้า (อัปโหลดภาพแบนเนอร์ของคุณได้ในหน้าหลังบ้าน)',
        hero_banner_url: '',
        promo_title: `เติมเงินวันนี้ รับโบนัสเพิ่ม ${CFG.topupBonusPercent}%`,
        promo_subtitle: 'รองรับพร้อมเพย์และทรูมันนี่ วอลเล็ท',
        promo_banner_url: ''
      },
      novels: JSON.parse(JSON.stringify(DEFAULT_DEMO_NOVELS)),
      unlockedIds: [],
      bookmarks: ['demo-1'],
      transactions: []
    };

    function saveDemo() {
      if (state.isLive) return;
      try {
        localStorage.setItem('goldnovel_demo_v2', JSON.stringify({
          mode: state.mode,
          readTheme: state.readTheme,
          fontSize: state.fontSize,
          user: state.user,
          settings: state.settings,
          novels: state.novels,
          unlockedIds: state.unlockedIds,
          bookmarks: state.bookmarks,
          transactions: state.transactions
        }));
      } catch (e) {}
    }

    function loadDemo() {
      if (state.isLive) return;
      try {
        const raw = localStorage.getItem('goldnovel_demo_v2');
        if (raw) {
          const p = JSON.parse(raw);
          state = { ...state, ...p, isLive: false };
        }
      } catch (e) {}
    }

    let toastTimer = null;
    function showToast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.remove('hidden');
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.add('hidden'), 3200);
    }

    function fileToDataUrl(file) {
      return new Promise((resolve, reject) => {
        const r = new FileReader();
        r.onload = () => resolve(r.result);
        r.onerror = reject;
        r.readAsDataURL(file);
      });
    }

    async function uploadImageFile(file, bucket = 'media') {
      if (!file) return '';
      if (!state.isLive) {
        return await fileToDataUrl(file);
      }
      const ext = file.name.split('.').pop() || 'jpg';
      const path = `${Date.now()}_${Math.random().toString(36).slice(2)}.${ext}`;
      const { error } = await sb.storage.from(bucket).upload(path, file);
      if (error) throw error;
      const { data } = sb.storage.from(bucket).getPublicUrl(path);
      return data.publicUrl;
    }

    async function loadLiveData() {
      if (!state.isLive) return;
      const { data: { session } } = await sb.auth.getSession();
      if (session?.user) {
        const { data: prof } = await sb.from('profiles').select('*').eq('id', session.user.id).single();
        state.user = prof || { id: session.user.id, email: session.user.email, role: 'reader', coin_balance: 0 };
      } else {
        state.user = null;
      }

      const { data: setRow } = await sb.from('site_settings').select('*').eq('id', 'main').single();
      if (setRow) state.settings = setRow;

      const { data: novels } = await sb.from('novels').select('*, chapters(*)').order('created_at', { ascending: false });
      if (novels) {
        novels.forEach(n => {
          n.chapters = (n.chapters || []).sort((a, b) => a.chapter_number - b.chapter_number);
        });
        state.novels = novels;
      }

      if (state.user) {
        const { data: unlocks } = await sb.from('unlocked_chapters').select('chapter_id').eq('user_id', state.user.id);
        state.unlockedIds = (unlocks || []).map(u => u.chapter_id);

        const { data: bms } = await sb.from('bookmarks_progress').select('novel_id').eq('user_id', state.user.id).eq('is_bookmarked', true);
        state.bookmarks = (bms || []).map(b => b.novel_id);

        const txQuery = state.user.role === 'admin'
          ? sb.from('transactions').select('*').order('created_at', { ascending: false }).limit(50)
          : sb.from('transactions').select('*').eq('user_id', state.user.id).order('created_at', { ascending: false }).limit(30);
        const { data: txs } = await txQuery;
        state.transactions = txs || [];
      } else {
        state.unlockedIds = [];
        state.bookmarks = [];
        state.transactions = [];
      }
    }

    function isAdmin() {
      return state.user && state.user.role === 'admin';
    }

    function getNovel(id) {
      return state.novels.find(n => n.id === id) || state.novels[0];
    }

    function isAccessible(ch) {
      return ch.price_coins === 0 || isAdmin() || state.unlockedIds.includes(ch.id);
    }

    function renderCoverBox(novel, extraClass = '') {
      if (novel.cover_url) {
        return `<img src="${novel.cover_url}" alt="${novel.title}" class="w-full h-full object-cover ${extraClass}">`;
      }
      return `
        <div class="w-full h-full cover-placeholder flex flex-col items-center justify-center p-4 text-center relative">
          <div class="absolute inset-2.5 border rounded-xl pointer-events-none" style="border-color: rgba(232,197,123,0.22);"></div>
          <span class="text-[10px] uppercase tracking-widest mb-2" style="color: var(--gold-2);">${(novel.categories || [])[0] || 'NOVEL'}</span>
          <div class="font-display-thai text-sm font-bold leading-snug line-clamp-3 px-1" style="color: var(--gold-1);">${novel.title}</div>
          <span class="text-[10px] mt-2 opacity-60" style="color: var(--text-sub);">รออัปโหลดปก</span>
        </div>
      `;
    }

    function applyChrome() {
      document.body.setAttribute('data-mode', state.mode);
      document.getElementById('brandNameSide').textContent = CFG.siteName;
      document.getElementById('modeBadgeSide').textContent = state.isLive ? 'เชื่อมต่อ Supabase แล้ว' : 'โหมดทดลอง (ยังไม่เชื่อม DB)';
      document.getElementById('coinBalanceText').textContent = (state.user?.coin_balance || 0).toLocaleString();
      document.getElementById('authHeaderBtn').textContent = state.user ? (state.user.display_name || state.user.email.split('@')[0]) : 'เข้าสู่ระบบ';

      const showAdmin = isAdmin();
      document.getElementById('sideAdminBtn').classList.toggle('hidden', !showAdmin);
      document.getElementById('mobileAdminBtn').classList.toggle('hidden', !showAdmin);

      document.querySelectorAll('.mode-pill').forEach(btn => {
        const active = btn.getAttribute('data-set-mode') === state.mode;
        btn.style.backgroundColor = active ? 'var(--gold-soft)' : 'transparent';
        btn.style.color = active ? 'var(--gold-1)' : 'var(--text-muted)';
      });

      document.querySelectorAll('.side-nav').forEach(btn => {
        const v = btn.getAttribute('data-view');
        const active = v && (v === state.view || (v === 'home' && (state.view === 'novel' || state.view === 'reader')));
        btn.classList.toggle('sidebar-item-active', !!active);
        if (!active) btn.style.color = 'var(--text-sub)';
        else btn.style.color = '';
      });

      document.querySelectorAll('.top-tab').forEach(btn => {
        const t = btn.getAttribute('data-top-tab');
        const active = (t === 'home' && state.view === 'home' && !state.activeCategory) ||
                       (t === 'categories' && !!state.activeCategory);
        btn.style.borderColor = active ? 'var(--gold-1)' : 'transparent';
        btn.style.color = active ? 'var(--gold-1)' : 'var(--text-sub)';
      });
    }

    function renderHome() {
      const q = state.searchQuery.trim().toLowerCase();
      const filtered = state.novels.filter(n => {
        const mQ = !q || n.title.toLowerCase().includes(q) || (n.author || '').toLowerCase().includes(q);
        const mC = !state.activeCategory || (n.categories || []).includes(state.activeCategory);
        return mQ && mC;
      });

      if (q || state.activeCategory) {
        return `
          <div class="fade-in">
            <div class="flex items-center justify-between mb-5">
              <div>
                <h1 class="text-xl font-bold">${state.activeCategory ? `หมวดหมู่: ${state.activeCategory}` : `ผลการค้นหา: "${state.searchQuery}"`}</h1>
                <p class="text-xs" style="color: var(--text-sub);">พบ ${filtered.length} เรื่อง</p>
              </div>
              <button type="button" id="clearFilterBtn" class="px-4 py-2 rounded-xl text-xs font-medium card-panel">← กลับหน้าหลัก</button>
            </div>
            <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-4">
              ${filtered.length === 0 ? `<div class="col-span-full card-panel rounded-2xl p-10 text-center text-sm" style="color: var(--text-sub);">ยังไม่มีนิยายในหมวดนี้</div>` :
                filtered.map(n => `
                  <button type="button" data-open-novel="${n.id}" class="text-left rounded-2xl overflow-hidden relative aspect-[3/4.3] border hover:-translate-y-1 transition-transform" style="border-color: var(--border-subtle);">
                    ${renderCoverBox(n)}
                    <div class="absolute inset-x-0 bottom-0 p-2.5 bg-gradient-to-t from-black/90 via-black/50 to-transparent">
                      <div class="text-xs font-semibold text-white line-clamp-2">${n.title}</div>
                      <div class="text-[10px] text-amber-300 mt-1">🔥 ${(n.views || 0).toLocaleString()} · ${n.status}</div>
                    </div>
                  </button>
                `).join('')}
            </div>
          </div>
        `;
      }

      const top5 = state.novels.slice(0, 5);
      const weekly = state.novels.filter(n => state.rankFilter === 'ทั้งหมด' || n.audience === state.rankFilter).slice(0, 5);
      const featured = state.novels.find(n => n.is_featured) || state.novels[0];
      const s = state.settings;

      return `
        <div class="fade-in space-y-7">
          <!-- Hero Banner -->
          <section class="relative rounded-3xl overflow-hidden border min-h-[240px] sm:min-h-[285px] flex items-center hero-placeholder" style="border-color: var(--border-subtle);">
            ${s.hero_banner_url ? `<img src="${s.hero_banner_url}" alt="Hero Banner" class="absolute inset-0 w-full h-full object-cover">` : ''}
            <div class="absolute inset-0 bg-gradient-to-r from-[#0B0D14]/92 via-[#0B0D14]/65 to-transparent"></div>
            <div class="relative z-10 p-6 sm:p-10 max-w-xl">
              <h1 class="font-display-thai text-2xl sm:text-4xl font-extrabold leading-tight hero-text-gradient mb-2.5">${s.hero_title}</h1>
              <p class="text-xs sm:text-sm text-neutral-200/90 mb-5 leading-relaxed">${s.hero_tagline}</p>
              <div class="flex flex-wrap gap-2.5">
                ${featured ? `<button type="button" data-open-novel="${featured.id}" class="px-6 py-2.5 rounded-full text-sm btn-gold">อ่านเลย →</button>` : ''}
                ${isAdmin() ? `<button type="button" data-go-admin-tab="banners" class="px-4 py-2.5 rounded-full text-xs font-medium bg-white/10 text-amber-200 border border-amber-300/30 hover:bg-white/15">แก้ไข / อัปโหลดแบนเนอร์</button>` : ''}
              </div>
            </div>
          </section>

          <!-- Popular + Weekly Ranking -->
          <section id="rankingSection" class="grid grid-cols-1 xl:grid-cols-12 gap-6 items-start">
            <div class="xl:col-span-8">
              <div class="flex items-end justify-between mb-3.5">
                <div>
                  <h2 class="text-lg font-bold flex items-center gap-2"><span>🔥</span><span>นิยายยอดนิยม</span></h2>
                  <p class="text-xs" style="color: var(--text-sub);">เรื่องที่คนอ่านมากที่สุดในตอนนี้</p>
                </div>
                ${isAdmin() ? `<button type="button" data-go-admin-tab="novels" class="text-xs font-medium hover:underline" style="color: var(--gold-1);">+ เพิ่มนิยายใหม่</button>` : ''}
              </div>
              <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-3">
                ${top5.length === 0 ? `<div class="col-span-full card-panel rounded-2xl p-8 text-center text-sm" style="color: var(--text-sub);">ยังไม่มีนิยาย กดเข้าเมนู "หลังบ้านนักเขียน" เพื่อเพิ่มเรื่องแรกได้เลย</div>` :
                  top5.map((n, idx) => {
                    const rCls = idx === 0 ? 'rank-1' : idx === 1 ? 'rank-2' : idx === 2 ? 'rank-3' : 'rank-n';
                    return `
                      <button type="button" data-open-novel="${n.id}" class="text-left rounded-2xl overflow-hidden relative aspect-[3/4.4] border hover:-translate-y-1 transition-transform" style="border-color: var(--border-subtle);">
                        ${renderCoverBox(n)}
                        <div class="absolute inset-0 bg-gradient-to-t from-[#0B0D13] via-transparent to-transparent"></div>
                        <span class="absolute top-2 left-2 w-7 h-7 rounded-lg flex items-center justify-center text-xs font-bold ${rCls}">${idx + 1}</span>
                        <div class="absolute bottom-0 inset-x-0 p-2.5">
                          <div class="text-xs font-semibold text-white line-clamp-2 mb-1">${n.title}</div>
                          <div class="flex items-center justify-between text-[10px]">
                            <span class="text-amber-300">🔥 ${(n.views || 0).toLocaleString()}</span>
                            <span class="px-1.5 py-0.5 rounded" style="background-color: ${n.status === 'จบแล้ว' ? 'rgba(34,197,94,0.22)' : 'rgba(232,197,123,0.2)'}; color: ${n.status === 'จบแล้ว' ? '#4ADE80' : '#F3D999'};">${n.status}</span>
                          </div>
                        </div>
                      </button>
                    `;
                  }).join('')}
              </div>
            </div>

            <div class="xl:col-span-4 card-panel rounded-2xl p-4">
              <h2 class="text-base font-bold flex items-center gap-2 mb-3"><span>🏆</span><span>อันดับประจำสัปดาห์</span></h2>
              <div class="grid grid-cols-3 gap-1.5 p-1 rounded-xl mb-3" style="background-color: var(--bg-input);">
                ${['ทั้งหมด', 'ชาย', 'หญิง'].map(tab => `
                  <button type="button" data-rank-filter="${tab}" class="py-1.5 rounded-lg text-xs font-semibold" style="${state.rankFilter === tab ? 'background: linear-gradient(135deg, #F3D999, #D4A857); color: #161410;' : 'color: var(--text-sub);'}">${tab}</button>
                `).join('')}
              </div>
              <div class="space-y-1.5">
                ${weekly.map((n, i) => `
                  <button type="button" data-open-novel="${n.id}" class="w-full flex items-center gap-3 p-2 rounded-xl text-left hover:bg-white/5">
                    <span class="w-5 text-center text-sm font-bold" style="color: ${i < 3 ? 'var(--gold-1)' : 'var(--text-muted)'};">${i + 1}</span>
                    <div class="w-10 h-12 rounded-lg overflow-hidden shrink-0 border" style="border-color: var(--border-subtle);">${renderCoverBox(n)}</div>
                    <div class="min-w-0 flex-1">
                      <div class="text-xs font-semibold line-clamp-2">${n.title}</div>
                      <div class="text-[11px] text-amber-400">🔥 ${(n.views || 0).toLocaleString()}</div>
                    </div>
                  </button>
                `).join('')}
              </div>
            </div>
          </section>

          <!-- Recommended + Promo -->
          <section id="promoSection" class="grid grid-cols-1 lg:grid-cols-12 gap-6">
            ${featured ? `
              <div class="lg:col-span-7 flex flex-col">

    function renderNovelDetail() {
      const novel = getNovel(state.activeNovelId);
      if (!novel) return `<div class="p-8 text-center">ไม่พบนิยาย</div>`;
      const chapters = novel.chapters || [];
      const unlockedCount = chapters.filter(c => isAccessible(c)).length;
      const pct = chapters.length ? Math.round((unlockedCount / chapters.length) * 100) : 0;

      return `
        <div class="fade-in max-w-4xl mx-auto space-y-6">
          <button type="button" data-view="home" class="text-xs sm:text-sm font-medium hover:underline" style="color: var(--gold-1);">← กลับหน้าหลัก</button>
          <div class="card-panel rounded-3xl p-5 sm:p-7 flex flex-col sm:flex-row gap-6">
            <div class="w-40 sm:w-48 mx-auto sm:mx-0 shrink-0 rounded-2xl overflow-hidden aspect-[3/4] border" style="border-color: var(--border-subtle);">${renderCoverBox(novel)}</div>
            <div class="flex-1 flex flex-col justify-between">
              <div>
                <div class="flex flex-wrap gap-1.5 mb-2">
                  ${(novel.categories || []).map(c => `<span class="text-[11px] px-2.5 py-0.5 rounded-full" style="background-color: var(--gold-soft); color: var(--gold-1);">${c}</span>`).join('')}
                </div>
                <h1 class="text-2xl font-bold mb-1">${novel.title}</h1>
                <div class="text-xs mb-3" style="color: var(--text-muted);">โดย ${novel.author} · ${novel.status}</div>
                <p class="text-sm leading-relaxed mb-5" style="color: var(--text-sub);">${novel.synopsis || ''}</p>
              </div>
              <div>
                <div class="flex justify-between text-xs mb-1.5" style="color: var(--text-sub);">
                  <span>ปลดล็อกแล้ว</span><span>${unlockedCount}/${chapters.length} ตอน (${pct}%)</span>
                </div>
                <div class="w-full h-2 rounded-full overflow-hidden mb-4" style="background-color: var(--bg-input);">
                  <div class="h-full" style="width:${pct}%; background: linear-gradient(90deg, #D4A857, #F3D999);"></div>
                </div>
                <div class="flex flex-wrap gap-2.5">
                  ${chapters.length ? `<button type="button" data-open-ch="${chapters[0].id}" class="px-6 py-2.5 rounded-full text-sm btn-gold">เริ่มอ่านตอนที่ 1</button>` : ''}
                  <button type="button" data-toggle-bm="${novel.id}" class="px-4 py-2.5 rounded-full text-xs font-medium" style="background-color: var(--bg-input); border: 1px solid var(--border-subtle);">${state.bookmarks.includes(novel.id) ? '🔖 อยู่ในคลังแล้ว' : '📑 เพิ่มเข้าคลัง'}</button>
                </div>
              </div>
            </div>
          </div>

          <div class="card-panel rounded-2xl overflow-hidden">
            <div class="px-5 py-4 border-b font-bold text-sm" style="border-color: var(--border-soft);">สารบัญตอน (${chapters.length} ตอน)</div>
            <div>
              ${chapters.length === 0 ? `<div class="p-8 text-center text-xs" style="color: var(--text-muted);">ยังไม่มีตอนนิยาย เพิ่มตอนได้ในหน้า "หลังบ้านนักเขียน"</div>` :
                chapters.map(ch => {
                  const open = isAccessible(ch);
                  const badge = ch.price_coins === 0
                    ? `<span class="text-xs px-2.5 py-1 rounded-full" style="background-color: rgba(34,197,94,0.16); color: #4ADE80;">อ่านฟรี</span>`
                    : open
                      ? `<span class="text-xs px-2.5 py-1 rounded-full" style="background-color: var(--gold-soft); color: var(--gold-1);">✓ ปลดล็อกแล้ว</span>`
                      : `<span class="text-xs px-2.5 py-1 rounded-full font-semibold" style="background-color: var(--bg-input); color: var(--gold-1);">🔒 ${ch.price_coins} เหรียญ</span>`;
                  return `
                    <button type="button" data-open-ch="${ch.id}" class="w-full text-left px-5 py-3.5 flex items-center justify-between gap-3 border-b last:border-b-0 hover:bg-white/5" style="border-color: var(--border-soft);">
                      <div class="flex items-center gap-3 min-w-0">
                        <span class="text-xs w-14 shrink-0" style="color: var(--text-muted);">ตอนที่ ${ch.chapter_number}</span>
                        <span class="text-sm font-medium truncate">${ch.title}</span>
                      </div>
                      ${badge}
                    </button>
                  `;
                }).join('')}
            </div>
          </div>
        </div>
      `;
    }

    function renderReader() {
      const novel = getNovel(state.activeNovelId);
      const chapters = novel?.chapters || [];
      const idx = chapters.findIndex(c => c.id === state.activeChapterId);
      const ch = chapters[idx] || chapters[0];
      if (!ch) return `<div class="p-8 text-center">ไม่พบตอนนิยาย</div>`;
      const prev = idx > 0 ? chapters[idx - 1] : null;
      const next = idx < chapters.length - 1 ? chapters[idx + 1] : null;
      const paras = String(ch.content || '').split(/\n+/).filter(Boolean).map(p => `<p>${p}</p>`).join('');

      return `
        <div class="fade-in max-w-2xl mx-auto">
          <div class="flex flex-wrap items-center justify-between gap-3 mb-5 pb-3 border-b" style="border-color: var(--border-soft);">
            <button type="button" data-open-novel="${novel.id}" class="text-xs sm:text-sm font-medium hover:underline" style="color: var(--gold-1);">← สารบัญ ${novel.title}</button>
            <div class="flex items-center gap-2">
              <div class="flex gap-1 p-1 rounded-lg" style="background-color: var(--bg-input);">
                <button type="button" data-rtheme="dark" class="px-2 py-1 rounded text-[11px]" style="${state.readTheme === 'dark' ? 'background-color: var(--gold-soft); color: var(--gold-1);' : 'color: var(--text-sub);'}">มืด</button>
                <button type="button" data-rtheme="warm" class="px-2 py-1 rounded text-[11px]" style="${state.readTheme === 'warm' ? 'background-color: var(--gold-soft); color: var(--gold-1);' : 'color: var(--text-sub);'}">อุ่น</button>
                <button type="button" data-rtheme="sepia" class="px-2 py-1 rounded text-[11px]" style="${state.readTheme === 'sepia' ? 'background-color: var(--gold-soft); color: var(--gold-1);' : 'color: var(--text-sub);'}">Sepia</button>
              </div>
              <button type="button" id="fontDownBtn" class="w-8 h-8 rounded-lg text-xs font-bold" style="background-color: var(--bg-input);">A-</button>
              <button type="button" id="fontUpBtn" class="w-8 h-8 rounded-lg text-xs font-bold" style="background-color: var(--bg-input);">A+</button>
            </div>
          </div>

          <article class="reading-sheet rounded-3xl p-6 sm:p-10 border mb-6" data-read-theme="${state.readTheme}">
            <div class="text-center mb-7 pb-5 border-b" style="border-color: var(--border-soft);">
              <div class="text-xs uppercase tracking-widest mb-1" style="color: var(--gold-2);">ตอนที่ ${ch.chapter_number}</div>
              <h1 class="text-xl sm:text-2xl font-bold">${ch.title}</h1>
            </div>
            <div class="reading-prose" style="font-size: ${state.fontSize}px;">${paras}</div>
          </article>

          <div class="flex items-center justify-between gap-3">
            ${prev ? `<button type="button" data-open-ch="${prev.id}" class="px-4 py-2.5 rounded-full text-xs card-panel">← ตอนก่อนหน้า</button>` : '<div></div>'}
            ${next ? `<button type="button" data-open-ch="${next.id}" class="px-5 py-2.5 rounded-full text-xs btn-gold">ตอนถัดไป ${isAccessible(next) ? '→' : `(🔒 ${next.price_coins} เหรียญ)`}</button>` : `<button type="button" data-open-novel="${novel.id}" class="px-5 py-2.5 rounded-full text-xs btn-gold">กลับหน้าสารบัญ</button>`}
          </div>
        </div>
      `;
    }

    function renderLibrary() {
      const saved = state.novels.filter(n => state.bookmarks.includes(n.id));
      return `
        <div class="fade-in max-w-4xl mx-auto space-y-6">
          <div class="card-panel rounded-2xl p-6 flex flex-col sm:flex-row sm:items-center justify-between gap-4">

            </div>
            <button type="button" id="libTopupBtn" class="px-6 py-2.5 rounded-full text-sm btn-gold">+ เติมเหรียญ</button>

          <div>

              ${saved.length === 0 ? `<div class="col-span-full card-panel rounded-2xl p-8 text-center text-xs" style="color: var(--text-muted);">ยังไม่มีนิยายในคลัง</div>` :

                  </button>

            </div>
          </div>

          <div class="card-panel rounded-2xl overflow-hidden">
            <div class="px-5 py-4 border-b font-bold text-sm" style="border-color: var(--border-soft);">ประวัติการเติมและใช้เหรียญ</div>
            <div>
              ${state.transactions.length === 0 ? `<div class="p-6 text-center text-xs" style="color: var(--text-muted);">ยังไม่มีรายการ</div>` :
                state.transactions.map(tx => `
                  <div class="px-5 py-3 flex items-center justify-between border-b last:border-b-0 text-sm" style="border-color: var(--border-soft);">

                    <span class="font-bold" style="color: ${tx.coins_delta > 0 ? '#4ADE80' : 'var(--gold-1)'};">${tx.coins_delta > 0 ? '+' : ''}${tx.coins_delta} เหรียญ</span>
                  </div>
                `).join('')}
            </div>
          </div>
        </div>
      `;
    }
